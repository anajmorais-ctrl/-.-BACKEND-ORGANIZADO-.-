<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NutriVida - Calculadora IMC</title>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🥗 Clínica NutriVida</h1>
        <p>Cuide da sua saúde com quem entende do assunto!</p>
    </div>

    <!-- Imagem ilustrativa de nutrição -->
    <img class="imagem" src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=500" alt="Alimentação Saudável">

    <p>O acompanhamento do peso corporal é fundamental para manter uma rotina saudável e prevenir diversas doenças. Preencha o formulário abaixo para descobrir o seu IMC.</p>

    <hr>

    <form method="POST" action="">
        <p>
            <label>Nome do paciente:</label><br>
            <input type="text" name="nome" required style="width: 95%;">
        </p>
        <p>
            <label>Peso (kg):</label><br>
            <input type="number" step="0.1" name="peso" placeholder="Ex: 72" required style="width: 95%;">
        </p>
        <p>
            <label>Altura (m):</label><br>
            <input type="number" step="0.01" name="altura" placeholder="Ex: 1.65" required style="width: 95%;">
        </p>
        <p>
            <input type="submit" name="calcular" value="Calcular IMC" style="padding: 8px 15px; cursor: pointer;">
        </p>
    </form>
