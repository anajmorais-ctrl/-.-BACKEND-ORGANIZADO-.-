<!DOCTYPE html>
<html lang="pt-br">
<div class="box">
    <h2> Abastecer</h2>

    <form method="POST" action="">
        <label>Tipo de combustível:</label><br>
        <select name="combustivel" required>
            <option value="">Selecione...</option>
            <option value="gasolina">Gasolina (R$ 6,20)</option>
            <option value="etanol">Etanol (R$ 4,20)</option>
            <option value="diesel">Diesel (R$ 6,00)</option>
        </select><br><br>

        <label>Quantidade de litros:</label><br>
        <input type="number" step="0.01" name="litros" required><br><br>

        <input type="submit" name="calcular" value="Calcular">
    </form>
